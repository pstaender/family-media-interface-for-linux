[package]
name = "curator"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.37.0"
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
libc = "0.2.191"
lofty = "0.25.5"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
zbus = "5"

# `cargo build` builds only the media center; the browser window needs WebKitGTK dev files:
# `cargo build -p curator-web` (or `--workspace`).
[workspace]
members = [".", "web"]
